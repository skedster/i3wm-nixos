[colors]
background = ${xrdb:color0:#221c21}
foreground = ${xrdb:color15:#ffffff}
primary    = ${xrdb:color1:#ED99CA}
inactive   = ${xrdb:color8:#776272}

[bar/main]
monitor = HDMI-1-0
width = 100%
height = 32
bottom = false
fixed-center = true
enable-ipc = true

background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10;2"

modules-left = left-bracket xworkspaces-main right-bracket pipe-sep time pipe-sep storage
modules-center = title
modules-right = tray pipe-sep volume pipe-sep memory pipe-sep date

padding-left = 0
padding-right = 1
module-margin = 0

[bar/laptop]
monitor = eDP
width = 100%
height = 32
bottom = false
fixed-center = true
enable-ipc = true

background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10;2"

modules-left = left-bracket xworkspaces-laptop right-bracket pipe-sep time pipe-sep storage
modules-center = title
modules-right = volume pipe-sep memory pipe-sep date

padding-left = 0
padding-right = 1
module-margin = 0

[module/left-bracket]
type = custom/text
content = "[ "
content-foreground = ${colors.inactive}

[module/right-bracket]
type = custom/text
content = " ]"
content-foreground = ${colors.inactive}

[module/pipe-sep]
type = custom/text
content = " | "
content-foreground = ${colors.inactive}

[module/xworkspaces-main]
type = internal/xworkspaces
pin-workspaces = false
enable-click = true
enable-scroll = false

icon-0 = 1;1
icon-1 = 2;2
icon-2 = 3;3
icon-3 = 4;4
icon-4 = 5;5

format = <label-state>

label-active = %icon%
label-active-background = ${colors.primary}
label-active-foreground = ${colors.background}
label-active-padding = 1

label-occupied = %icon%
label-occupied-background = ${colors.background}
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

label-urgent = %icon%
label-urgent-background = #f38ba8
label-urgent-foreground = ${colors.background}
label-urgent-padding = 1

label-empty = %icon%
label-empty-background = ${colors.background}
label-empty-foreground = ${colors.inactive}
label-empty-padding = 1

[module/xworkspaces-laptop]
type = internal/xworkspaces
pin-workspaces = false
enable-click = true
enable-scroll = false

icon-0 = 6;6
icon-1 = 7;7
icon-2 = 8;8
icon-3 = 9;9
icon-4 = 10;10

format = <label-state>

label-active = %icon%
label-active-background = ${colors.primary}
label-active-foreground = ${colors.background}
label-active-padding = 1

label-occupied = %icon%
label-occupied-background = ${colors.background}
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

label-urgent = %icon%
label-urgent-background = #f38ba8
label-urgent-foreground = ${colors.background}
label-urgent-padding = 1

label-empty = %icon%
label-empty-background = ${colors.background}
label-empty-foreground = ${colors.inactive}
label-empty-padding = 1

[module/time]
type = internal/date
interval = 1
time = "%H:%M"
label = "%time%"
label-foreground = ${colors.foreground}

[module/storage]
type = internal/fs
mount-0 = /
interval = 30
fixed-values = true

format-mounted = <label-mounted>
format-mounted-prefix = "SSD "
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = %used% / %total%
label-mounted-foreground = ${colors.foreground}

[module/title]
type = internal/xwindow
format = <label>
label = %title:0:40:...%
label-foreground = ${colors.foreground}
label-empty = "desktop"
label-empty-foreground = ${colors.inactive}

[module/tray]
type = internal/tray
tray-position = right
tray-padding = 4
tray-size = 18

[module/volume]
type = custom/script
exec = v=$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2 * 100)}'); echo "${v}%"
interval = 1
format-prefix = "VOL "
format-prefix-foreground = ${colors.primary}
label-foreground = ${colors.foreground}
click-left = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
scroll-up = wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = "%gb_used% / %gb_total%"
label-foreground = ${colors.foreground}

[module/date]
type = internal/date
interval = 5
date = "%Y-%m-%d"
label = "[ %date% ]"
label-foreground = ${colors.foreground}
