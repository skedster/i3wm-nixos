# sharp edges
corner-radius = 0;

# backend and vsync
backend = "glx";
vsync = true;

# Keep window-level opacity fully solid so text and UI elements never fade
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;

# Enable background blur for native window transparency (like Kitty)
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

# Native box blur method (supported by standard picom builds)
blur-method = "box";
blur-size = 5;

# Exclude docks, bars, and desktop elements from blurring
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'bar'",
  "class_g = 'Polybar'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# subtle fade animations
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 4;

# subtle transition animations
animations = true;
animation-stiffness = 300.0;
animation-dampening = 28.0;
animation-clipping = false;
animation-for-open-window = "zoom";
animation-for-menu-window = "slide-down";
animation-for-transient-window = "slide-up";
